# 仅限实验室 — Phase1 单节点 KRaft + toxiproxy（3 个入口端口）。
# 客户端必须只使用 toxiproxy 端口。
# Bootstrap：127.0.0.1:19092,127.0.0.1:19093,127.0.0.1:19094
#
# 宿主机网络说明：本机曾把 iptables-legacy 的 FORWARD 策略设为 DROP，
# 从而中断了 bridge 上的容器间流量。启动前请确保 FORWARD 为 ACCEPT：
#   sudo iptables-legacy -P FORWARD ACCEPT
#
# Phase1：一个 broker；三个 toxiproxy 前端都指向同一个 EXTERNAL
# 监听器，以便 QA 禁用 kafka1/2/3 来模拟完全断开。
# 3 broker 集群推迟。

services:
  kafka-1:
    image: apache/kafka:3.8.1
    hostname: kafka-1
    container_name: lab-kafka-1
    networks: [lab-kafka]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx384M -Xms256M
      KAFKA_OPTS: -Djava.net.preferIPv4Stack=true
      KAFKA_INITIAL_BROKER_REGISTRATION_TIMEOUT_MS: 120000
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  toxiproxy:
    image: shopify/toxiproxy:2.1.4
    container_name: lab-toxiproxy
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    ports:
      - "19092:19092"
      - "19093:19093"
      - "19094:19094"
      - "8474:8474"
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    networks: [lab-kafka]
    depends_on:
      kafka-1:
        condition: service_healthy

networks:
  lab-kafka:
    name: lab-mod-event-kafka
    driver: bridge
