name: Public builds and core tests

on:
  push:
    branches: [master, 'fix/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core ASan-UBSan and Python (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node24
        with:
          persist-credentials: false
      - name: Build public core image
        run: docker build --progress=plain --target core-ci -f .devcontainer/Dockerfile -t event-kafka-core-ci .
      - name: Run actual tests without external network
        run: docker run --rm --network none event-kafka-core-ci
      - name: Rebuild from local cache and rerun tests
        run: |
          docker build --progress=plain --target core-ci -f .devcontainer/Dockerfile -t event-kafka-core-ci .
          docker run --rm --network none event-kafka-core-ci

  fs-module:
    name: Real public FreeSWITCH SDK compile (not runtime qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node24
        with:
          persist-credentials: false
      - name: Prepare pinned public FreeSWITCH sources
        run: bash ci/prepare-fs-sources.sh
      - name: Build module with pinned public sources
        run: docker build --progress=plain --target fs-module -f .devcontainer/Dockerfile -t event-kafka-fs-module .
      - name: Verify SDK version and dynamic linkage
        run: docker run --rm --network none event-kafka-fs-module
