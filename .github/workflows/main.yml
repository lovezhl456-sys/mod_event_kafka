name: Run tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  mod_event_kafka_job:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    name: Build mod_event_kafka
    steps:
      # 要使用本仓库的私有 action，
      # 必须先检出仓库
      - name: Checkout
        uses: actions/checkout@v2
      - name: Prepopulate Docker file
        run: |
          sed -i 's/#INSERT_HERE/COPY . \/mod_event_kafka/g' .devcontainer/Dockerfile
          cat .devcontainer/Dockerfile
      # 这是单独用来配置 buildx runner 的 action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        with:
          driver-opts: network=host
      # 这样就可以使用 Actions 自带的缓存
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build Docker Container
        uses: docker/build-push-action@v2
        id: docker_build
        with:
          # 使用 "load: true" 会强制 docker 驱动
          # 这里不需要，因为前面已经设置过
          #load: true
          push: true
          tags: localhost:5000/${{ github.repository }}_build:latest
          context: .
          file: .devcontainer/Dockerfile
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            SIGNALWIRE_TOKEN=${{ secrets.SIGNALWIRE_TOKEN }}

      - name: Compile
        run: |
          docker run -i localhost:5000/${{ github.repository }}_build:latest bash -c "cd /mod_event_kafka && make && ls"
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
